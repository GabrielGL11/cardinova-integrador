<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cardinova</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header>
        <h1>Cardinova</h1>

        <nav id="menu" style="display: none;">

            <button id="agendamiento">
                Agendamiento
            </button>

            <button id="citas" style="display: none;">
                Citas médicas
            </button>

            <button id="farmacias">
                Farmacias
            </button>

            <button id="admin-btn" style="display: none;">
                Administración
            </button>

            <button id="logout-btn" style="display: none;">
                Cerrar Sesión
            </button>

        </nav>
    </header>

    <main id="app">

        <div id="login-container">

            <h2>Iniciar Sesión</h2>

            <input
                type="email"
                id="correo"
                placeholder="Correo"
            >

            <br><br>

            <input
                type="password"
                id="contrasena"
                placeholder="Contraseña"
            >

            <br><br>

            <button id="btn-login">
                Ingresar
            </button>

            <p id="mensaje"></p>

        </div>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
